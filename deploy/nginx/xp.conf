server {
    listen 127.0.0.1:8080;
    server_name xp.irfankerem.com;
    root /srv/sites/xp;
    absolute_redirect off;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 /404.html;
    expires -1;
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }

    # PocketBase. The dashboard and superuser login are reachable only over an
    # SSH tunnel to 127.0.0.1:8090, never through the public site.
    location ^~ /_/ { return 404; }
    location ^~ /api/collections/_superusers/ { return 404; }
    # ^~ so the image regex below cannot catch /api/files/...jpg photos.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Only cloudflared reaches this server, so its client-IP header is trusted.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        # Realtime is Server-Sent Events: stream it, and keep idle streams open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 12m;
        expires off;
    }
    location ^~ /_next/static/ { expires 1y; }
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?)$ { expires 1y; }
}
